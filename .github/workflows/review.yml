name: Independent review

# The reviewer itself (FR-001, FR-019, FR-041, research.md R-013).
#
# Three things here are load-bearing and none is a default:
#
#   - `concurrency` with `cancel-in-progress: true` implements FR-019's superseded-run discard. A
#     run whose revision has been pushed past is cancelled rather than allowed to finish and report
#     against a stale head, which is stronger than letting it complete and discarding the outcome —
#     and it does not burn tokens on a verdict already known to be unusable.
#
#   - `runs-on: [self-hosted, agents-host]` keeps model credentials on the developer machine
#     (FR-032). The runner's configured job-slot count is the host-wide concurrency cap, and this
#     job takes an ordinary slot in it — Principle VIII counts reviewer jobs like any other, and an
#     exempted reviewer would be the one job able to thrash the machine it protects.
#
#   - `--target` is passed explicitly. The service resolves the constitution, the settings, and
#     every inspected path through that parameter and never through the working directory
#     (FR-026, FR-027), which is what keeps the seam addressable for a future run against a
#     repository the service does not itself live in.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The workflow token reads; it never reports the gate. Only the App installation can create a check
# run, which is what makes FR-022's identity separation structural rather than conventional.
permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    # A fork's pull request MUST NOT reach the self-hosted runner. This job checks out the pull
    # request's own code and runs `npm ci` and `npm run build` against it, so on a public repository
    # without this guard any stranger opening a pull request would get arbitrary code execution on
    # the runner host. GitHub's own guidance is that self-hosted runners belong to private
    # repositories; this condition is what makes them safe on a public one.
    #
    # The repository's fork-pull-request approval policy is set to `all_external_contributors`,
    # which is defence in depth rather than the control — approval is a human clicking a button,
    # and one misclick would be enough. This guard cannot be misclicked.
    #
    # Consequence, and it is the correct one: a fork's pull request gets no review, so the gate is
    # never reported and branch protection keeps the pull request un-mergeable. Un-mergeable and
    # quiet beats mergeable — the same boundary research.md R-013 records for a review that never
    # starts. A fork contributor's change reaches `main` by a maintainer taking it onto a branch in
    # this repository, where it is reviewed like anything else.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, agents-host]

    steps:
      - uses: actions/checkout@v4
        with:
          # The head revision under review, not the merge commit: every verdict and finding is
          # bound to the exact revision examined (FR-009).
          ref: ${{ github.event.pull_request.head.sha }}
          path: checkout

      - uses: actions/setup-node@v4
        with:
          node-version-file: checkout/.nvmrc

      - run: npm ci
        working-directory: checkout

      - run: npm run build
        working-directory: checkout

      - name: Review
        working-directory: checkout
        env:
          # From the runner's own environment, never from Actions secrets (FR-032). A secret
          # configured here would put the model credential inside the blast radius of the very
          # pull requests this job reviews.
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          REVIEW_APP_ID: ${{ env.REVIEW_APP_ID }}
          REVIEW_APP_PRIVATE_KEY: ${{ env.REVIEW_APP_PRIVATE_KEY }}
          # FR-041: the job measures its own queue wait, so the threshold is checked against a
          # figure the job can actually observe.
          REVIEW_RUN_CREATED_AT: ${{ github.event.repository.updated_at }}
        run: |
          node dist/cli.js \
            --target "${{ github.repository }}" \
            --checkout "$PWD" \
            --pull-request "${{ github.event.pull_request.number }}"
